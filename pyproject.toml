[project]
name = "bionic-company"
version = "0.1.0"
description = "Bionic Company: organizational contract and twin (M0 — Observe)"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.scripts]
bionic = "bionic.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bionic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
