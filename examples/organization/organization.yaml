# The organization Bionic Company is being validated with (docs/m0-model.md).
# This file is data: another organization writes its own and uses the same code.

organization:
  id: jjdsnt
  name: Jaime Dias — creative ecosystem

domains:
  - {id: kdp-studio,   name: KDP Studio,   status: active}
  - {id: cine-toaster, name: Cine Toaster, status: active}
  - {id: pulse,        name: Pulse,        status: planned}
  - {id: manual,       name: Outside any domain (by hand), kind: external}

capabilities:
  - id: editorial-production
    name: Editorial production
    description: Research, write, revise, typeset and publish books.
  - id: audiovisual-production
    name: Audiovisual production
    description: Make films, trailers and other audiovisual work.
  - id: market-relationships
    name: Market intelligence & relationships
    description: Audiences, communities, communication, PR and reputation.

provisions:
  - {capability: editorial-production,   domain: kdp-studio}
  - {capability: audiovisual-production, domain: cine-toaster}
  - {capability: market-relationships,   domain: pulse}   # planned: a gap until Pulse is active

initiatives:
  - id: a-era-dos-agentes
    name: A Era dos Agentes
    intent: A practical introduction to agentic AI, in Brazilian Portuguese, with an English edition to come.
  - id: singular
    name: Singular
    intent: A creative work moving between audiovisual, editorial and market-facing activity.

# What the organization makes and releases. A product's identity is the organization's;
# custody records which domain works on it, under that domain's own reference, and when.
products:
  - id: a-era-dos-agentes-book
    name: A Era dos Agentes (book)
    initiative: a-era-dos-agentes
    kind: book
    after_release: editions          # non-fiction: a later edition may revise it
    custody:
      - {domain: kdp-studio, ref: a-era-dos-agentes}

  - id: singular-book
    name: Singular (book)
    initiative: singular
    kind: book                       # fiction: a released version never changes
    custody:
      - {domain: manual, ref: singular-book, since: 2025-07-16}   # not yet in KDP Studio; not released

  - id: singular-film
    name: Singular (film)
    initiative: singular
    kind: film                       # the screenplay is part of the film
    custody:
      - {domain: manual,       ref: singular-film, until: 2026-10-03}
      - {domain: cine-toaster, ref: singular,      since: 2026-10-03}   # toast migrate, CT-0054

# How products feed one another. Domains do not know each other; the organization records it.
flows:
  - {source: singular-book, target: singular-film, relation: adapted into}

# Where adapters read each domain's work units. Local to this machine.
sources:
  - {domain: kdp-studio, path: ~/books/a-era-dos-agentes}
  - {domain: cine-toaster, path: ~/films/singular}
  - {domain: manual,       path: manual/singular.yaml}
